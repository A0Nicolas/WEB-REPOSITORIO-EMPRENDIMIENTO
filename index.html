<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pastelería - SweetFruits</title>
  <link rel="stylesheet" href="./estilos.css">
  <script type="module" src="./componentes/tarjeta-promocion.js"></script>
</head>
<body>
  <h1>Pastelería - SweetFruits</h1>
  
  <main class="catalogo">

    <tarjeta-promocion precio="18.50" descuento="15" destacado>
      <img slot="foto" src="./img/leonel-brazog.jpg" alt="Brazo gitano">
      <h3 slot="nombre">Pastel de fresa</h3>
      <p>Delicioso brazo gitano con relleno de crema pastelera y cubierta de mermelada de fresa.</p>
    </tarjeta-promocion>

    <tarjeta-promocion precio="12.00" descuento="10">
      <img slot="foto" src="./img/leonel-torta-cafe.jpg" alt="Torta de cafe">
      <h3 slot="nombre">Torta de cafe</h3>
      <p>Deliciosa torta de café con crema de capuchino.</p>
    </tarjeta-promocion>

    <tarjeta-promocion precio="15.75" descuento="0">
      <img slot="foto" src="./img/leonel-torta-naranja.jpg" alt="Torta de naranja">
      <h3 slot="nombre">Torta de naranja</h3>
      <p>Delicada torta de naranja con crema de limón y cubierta de merengue.</p>
    </tarjeta-promocion>

  </main>
</body>
</html>
